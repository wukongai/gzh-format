<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} · 公众号排版预览</title>
<style>
  body{margin:0;background:#eef0f2;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;-webkit-text-size-adjust:100%;}
  .gzh-toolbar{position:fixed;top:0;left:0;right:0;height:54px;background:#ffffff;box-shadow:0 1px 10px rgba(0,0,0,.08);display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:99;}
  .gzh-hint{font-size:13px;color:#6b7280;line-height:1.4;}
  .gzh-hint b{color:#111827;}
  .gzh-copy{background:#059669;color:#fff;border:0;border-radius:9px;padding:10px 20px;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 3px 10px rgba(5,150,105,.28);white-space:nowrap;transition:transform .08s,background .15s;}
  .gzh-copy:hover{background:#047857;}
  .gzh-copy:active{transform:translateY(1px);}
  .gzh-toast{position:fixed;top:66px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:11px 20px;border-radius:10px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s;z-index:100;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:88vw;text-align:center;}
  .gzh-toast.show{opacity:1;}
  /* 默认以手机阅读宽度换行，直接编辑同一份正文；窄窗口随屏收缩，不缩放字号。 */
  .gzh-stage{box-sizing:border-box;width:100%;max-width:390px;margin:78px auto 64px;padding:0;}
  .gzh-title-panel{background:#fff;border-radius:10px;padding:22px 24px;margin-bottom:16px;}
  .gzh-title-label{display:block;font-size:13px;color:#6b7280;margin-bottom:10px;}
  #gzh-title{box-sizing:border-box;width:100%;border:1px solid #d1d5db;border-radius:6px;padding:12px;font-family:inherit;font-size:24px;font-weight:600;line-height:1.5;color:#111827;background:#fff;}
  #gzh-title:focus{outline:2px solid #059669;outline-offset:2px;}
  #gzh-title[readonly]{border-color:transparent;cursor:text;}
  #gzh-title-warning:empty{display:none;}
  @media(max-width:520px){.gzh-toolbar{padding:0 12px;gap:8px;}.gzh-hint{flex:1;min-width:0;font-size:12px;}.gzh-copy{padding:10px 12px;}}
</style>
<!--GZH_EDIT_CSS-->
</head>
<body>
<div class="gzh-toolbar">
  <span class="gzh-hint"><b>手机预览</b> · 右侧复制到公众号</span>
  <button class="gzh-copy" id="gzhCopyBtn" onclick="gzhCopy()">📋 复制到公众号</button>
</div>
<div id="gzh-editor-toolbar"></div>
<div class="gzh-toast" id="gzhToast"></div>
<div class="gzh-stage">
  <div class="gzh-title-panel">
    <label class="gzh-title-label" for="gzh-title">文章标题</label>
    <input id="gzh-title" type="text" value="{{TITLE}}"{{TITLE_READONLY}} aria-describedby="gzh-title-warning">
    <p id="gzh-title-warning">{{TITLE_WARNING}}</p>
  </div>
  <div id="gzh-content">
<!--GZH_CONTENT-->
  </div>
</div>
<script>
  function gzhShowToast(msg){
    var t=document.getElementById('gzhToast');
    t.textContent=msg;t.classList.add('show');
    clearTimeout(t._timer);
    t._timer=setTimeout(function(){t.classList.remove('show');},2800);
  }
  function gzhCopy(){
    var el=document.getElementById('gzh-content');
    // 在副本上清理编辑器属性；自定义 copy 数据只含正文。
    var clone=el.cloneNode(true);
    clone.querySelectorAll('[data-gzh-edit-empty="1"]').forEach(function(node){node.remove();});
    clone.querySelectorAll('*').forEach(function(node){
      Array.from(node.attributes).forEach(function(attr){
        if(attr.name==='contenteditable'||attr.name==='spellcheck'||attr.name==='tabindex'||attr.name.startsWith('data-gzh-edit')||attr.name.startsWith('data-gzh-run'))node.removeAttribute(attr.name);
      });
    });
    var onCopy=function(event){
      if(event.clipboardData){
        event.clipboardData.setData('text/html',clone.innerHTML);
        event.clipboardData.setData('text/plain',clone.textContent);
        event.preventDefault();
      }
    };
    document.addEventListener('copy',onCopy,{once:true});
    // 选中渲染后的富文本节点并复制（等价于手动 Ctrl+A / Ctrl+C，保留全部样式）
    var range=document.createRange();
    range.selectNodeContents(el);
    var sel=window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    var ok=false;
    try{ok=document.execCommand('copy');}catch(e){ok=false;}
    document.removeEventListener('copy',onCopy);
    sel.removeAllRanges();
    var btn=document.getElementById('gzhCopyBtn');
    if(ok){
      gzhShowToast('✅ 已复制！去公众号编辑器按 Ctrl/⌘+V 粘贴即可');
      var old=btn.textContent;btn.textContent='✅ 已复制';
      setTimeout(function(){btn.textContent=old;},2200);
    }else{
      gzhShowToast('⚠ 自动复制失败，请手动全选(Ctrl/⌘+A)再复制(Ctrl/⌘+C)');
    }
  }
</script>
<!--GZH_EDIT_SCRIPT-->
</body>
</html>
